services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nodecanvas
      POSTGRES_USER: nodecanvas
      POSTGRES_PASSWORD: nodecanvas
    ports:
      - "5432:5432"
    volumes:
      - nodecanvas-pgvector:/var/lib/postgresql/data

volumes:
  nodecanvas-pgvector:
